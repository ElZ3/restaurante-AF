name: Auto Merge y Notificación
on:
  pull_request:
    branches: [ main ]
jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Aprobar y fusionar PR automáticamente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve
          gh pr merge ${{ github.event.pull_request.number }} --merge --admin
      - name: Notificar error por correo a Fabio
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Error en Pull Request - Sistema Restaurante"
          body: "El Pull Request de tu compañero ha fallado al intentar fusionarse automáticamente. El código requiere revisión manual."
          to: fabio203cruz@gmail.com
          from: GitHub Actions